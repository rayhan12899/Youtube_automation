<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="100%" stop-color="#0d1226"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7b2fff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#ring)" stroke-width="4" opacity="0.3"/>
  <!-- Microphone body -->
  <rect x="216" y="150" width="80" height="130" rx="40" fill="url(#ring)"/>
  <!-- Microphone stand -->
  <path d="M180 290 Q180 360 256 360 Q332 360 332 290" fill="none" stroke="url(#ring)" stroke-width="14" stroke-linecap="round"/>
  <line x1="256" y1="360" x2="256" y2="395" stroke="url(#ring)" stroke-width="14" stroke-linecap="round"/>
  <line x1="210" y1="395" x2="302" y2="395" stroke="url(#ring)" stroke-width="14" stroke-linecap="round"/>
</svg>
